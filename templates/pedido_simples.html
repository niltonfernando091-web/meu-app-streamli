{% extends "base.html" %}

{% block title %}Novo Pedido - {{ config.nome }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="display-5 mb-4">
            <i class="bi bi-plus-circle text-success"></i> Pedido Simplificado
        </h1>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST" action="{{ url_for('novo_pedido') }}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nome do Cliente *</label>
                    <input type="text" class="form-control" name="cliente_nome" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">CPF/CNPJ</label>
                    <input type="text" class="form-control" name="cliente_cpf" placeholder="000.000.000-00">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Forma de Pagamento *</label>
                    <select class="form-select" name="forma_pagamento" required>
                        <option value="">Selecione...</option>
                        <option value="À Vista">À Vista</option>
                        <option value="Prazo 30 dias">Prazo 30 dias</option>
                        <option value="Prazo 60 dias">Prazo 60 dias</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="PIX">PIX</option>
                        <option value="Boleto">Boleto</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Desconto (%)</label>
                    <input type="number" class="form-control" name="desconto" min="0" max="100" step="0.5" value="0">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Produto</label>
                <div class="row">
                    <div class="col-md-3">
                        <select class="form-select" name="tipo_produto" required>
                            <option value="">Tipo</option>
                            <option value="Linha 14">Linha 14</option>
                            <option value="Linha 10">Linha 10</option>
                            <option value="Linha 12">Linha 12</option>
                            <option value="Linha 20">Linha 20</option>
                            <option value="Linha 30">Linha 30</option>
                            <option value="Caibo 6,5">Caibo 6,5</option>
                            <option value="Ripa 3,25">Ripa 3,25</option>
                            <option value="Tábua 14">Tábua 14</option>
                            <option value="Tábua 12">Tábua 12</option>
                            <option value="Tábua 10">Tábua 10</option>
                            <option value="Tábua 20+">Tábua 20+</option>
                            <option value="Estaca 10x10">Estaca 10x10</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" name="nome_madeira" placeholder="Madeira (ex: Pinus)" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" step="0.01" class="form-control" name="comprimento" placeholder="Compr. (m)" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control" name="quantidade" placeholder="Qtd" value="1" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" step="0.01" class="form-control" name="preco_metro" placeholder="Preço/m" required>
                    </div>
                </div>
                <div class="mt-2">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="adicionarItemSimples()">
                        <i class="bi bi-plus-circle"></i> Adicionar Item
                    </button>
                </div>
            </div>

            <div class="mb-3" id="itensArea">
                <label class="form-label">Itens Adicionados</label>
                <div id="itensLista" class="border rounded p-2" style="min-height: 50px;">
                    <p class="text-muted text-center">Nenhum item adicionado</p>
                </div>
            </div>

            <input type="hidden" name="itens_json" id="itens_json">

            <button type="submit" class="btn btn-success btn-lg w-100">
                <i class="bi bi-check-circle"></i> Gerar PDF e Salvar
            </button>
        </form>
    </div>
</div>

<script>
// Versão simplificada para teste
let itensSimples = [];

function adicionarItemSimples() {
    const tipo = document.querySelector('select[name="tipo_produto"]').value;
    const madeira = document.querySelector('input[name="nome_madeira"]').value;
    const comprimento = parseFloat(document.querySelector('input[name="comprimento"]').value);
    const quantidade = parseInt(document.querySelector('input[name="quantidade"]').value);
    const preco = parseFloat(document.querySelector('input[name="preco_metro"]').value);

    if (!tipo || !madeira || !comprimento || !quantidade || !preco) {
        alert('Preencha todos os campos do produto!');
        return;
    }

    const subtotal = comprimento * quantidade * preco;
    const item = {
        tipo_produto: tipo,
        nome_madeira: madeira,
        comprimento: comprimento,
        quantidade: quantidade,
        preco_metro: preco,
        subtotal: subtotal
    };

    itensSimples.push(item);
    document.getElementById('itens_json').value = JSON.stringify(itensSimples);

    // Atualizar lista
    const lista = document.getElementById('itensLista');
    if (itensSimples.length === 1) {
        lista.innerHTML = '';
    }

    const div = document.createElement('div');
    div.className = 'alert alert-info alert-sm mb-1';
    div.innerHTML = `
        <strong>${item.tipo_produto}</strong> - ${item.nome_madeira} | 
        ${item.comprimento}m x ${item.quantidade} = R$ ${subtotal.toFixed(2)}
        <button class="btn btn-sm btn-danger float-end" onclick="removerItemSimples(${itensSimples.length - 1})">x</button>
    `;
    lista.appendChild(div);

    // Limpar campos
    document.querySelector('input[name="nome_madeira"]').value = '';
    document.querySelector('input[name="comprimento"]').value = '';
    document.querySelector('input[name="quantidade"]').value = '1';
    document.querySelector('input[name="preco_metro"]').value = '';
    document.querySelector('select[name="tipo_produto"]').value = '';
}

function removerItemSimples(index) {
    itensSimples.splice(index, 1);
    document.getElementById('itens_json').value = JSON.stringify(itensSimples);
    atualizarLista();
}

function atualizarLista() {
    const lista = document.getElementById('itensLista');
    lista.innerHTML = '';
    
    if (itensSimples.length === 0) {
        lista.innerHTML = '<p class="text-muted text-center">Nenhum item adicionado</p>';
        return;
    }

    itensSimples.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'alert alert-info alert-sm mb-1';
        div.innerHTML = `
            <strong>${item.tipo_produto}</strong> - ${item.nome_madeira} | 
            ${item.comprimento}m x ${item.quantidade} = R$ ${item.subtotal.toFixed(2)}
            <button class="btn btn-sm btn-danger float-end" onclick="removerItemSimples(${index})">x</button>
        `;
        lista.appendChild(div);
    });
}
</script>
{% endblock %}
